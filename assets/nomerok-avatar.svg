<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Номерок</title>
  <desc id="desc">Минималистичный тёмный аватар с номерным знаком 777</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#facc15" stroke-width="5" opacity=".9"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="#facc15" stroke-width="2" opacity=".2"/>

  <g filter="url(#shadow)" transform="rotate(-6 256 256)">
    <rect x="57" y="164" width="398" height="184" rx="28" fill="#0f172a" stroke="#facc15" stroke-width="8"/>
    <rect x="77" y="184" width="358" height="144" rx="17" fill="url(#plate)"/>
    <rect x="77" y="184" width="358" height="144" rx="17" fill="none" stroke="#94a3b8" stroke-width="3"/>

    <text x="104" y="284" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="900" letter-spacing="2" fill="#111827">Н777</text>
    <rect x="362" y="201" width="55" height="104" rx="5" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
    <text x="389" y="251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#111827">77</text>
    <path d="M372 270h35" stroke="#111827" stroke-width="3"/>
    <text x="389" y="297" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111827">RUS</text>
    <circle cx="91" cy="196" r="5" fill="#64748b"/>
    <circle cx="421" cy="316" r="5" fill="#64748b"/>
  </g>

  <text x="256" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" letter-spacing="8" fill="#facc15">НОМЕРОК</text>
</svg>
